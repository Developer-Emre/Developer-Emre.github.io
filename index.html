<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/image/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Emre Sarigul — Full Stack Developer</title>
    <meta name="description" content="Full-stack developer specializing in Python, React, TypeScript, and cloud technologies. Based in Istanbul." />
    <link rel="canonical" href="https://developer-emre.github.io/" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://developer-emre.github.io/" />
    <meta property="og:title"       content="Emre Sarigul — Full Stack Developer" />
    <meta property="og:description" content="Full-stack developer specializing in Python, React, TypeScript, and cloud technologies. Based in Istanbul." />
    <meta property="og:image"       content="https://developer-emre.github.io/image/emre-sarigul.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Emre Sarigul — Full Stack Developer" />
    <meta name="twitter:description" content="Full-stack developer specializing in Python, React, TypeScript, and cloud technologies. Based in Istanbul." />
    <meta name="twitter:image"       content="https://developer-emre.github.io/image/emre-sarigul.png" />
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EJ6L2YBB10"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EJ6L2YBB10');
    </script>

    <!-- Theme init: React'ten önce çalışır, FOUC'u önler -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
